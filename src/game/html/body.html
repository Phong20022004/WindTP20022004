<body>
<div class="wrap">
  <header><h1 class="hs"><i class="lgi dr" aria-hidden="true"></i><span class="hst">Long Tranh Hổ Đấu</span><i class="lgi tg" aria-hidden="true"></i></h1><div class="chips" id="chips">5.000 Chips</div></header>
  <p class="lead">Chọn một trò để xem luật chơi. Bài 3 cây chơi thử được, các trò khác đã có bàn thiết kế mẫu.</p>

</div></div>

<section id="game" hidden>

  <div class="seat"><div class="hand" id="dl"></div><p>Nhà cái <span id="dlS"></span></p></div>
  <div id="res" aria-live="polite"></div>
  <div class="seat"><div class="hand" id="me"></div><p>Bạn <span id="meS"></span></p></div>
  <div class="ctrl">
    <div class="bets" id="bets"></div>
    <button class="btn" id="deal">Chia bài</button>
  </div>
</section>
